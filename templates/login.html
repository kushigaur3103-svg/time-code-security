<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeCodeSecurity | System Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; background-image: radial-gradient(#1f2937 1px, transparent 1px); background-size: 30px 30px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white font-sans relative overflow-hidden">
    <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>
    <!-- Scanline Effect -->
    <div class="absolute inset-0 pointer-events-none bg-[linear-gradient(transparent_50%,rgba(0,0,0,0.1)_50%)] bg-[length:100%_4px] opacity-20 z-50"></div>

    <div class="max-w-md w-full bg-gray-900/80 backdrop-blur-2xl border border-gray-800 rounded-xl shadow-[0_0_50px_rgba(34,197,94,0.1)] p-8 relative z-10 transition-all hover:shadow-[0_0_50px_rgba(34,197,94,0.2)]">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-blue-500 tracking-tight mb-2">TimeCodeSecurity</h1>
            <p class="text-green-500 font-mono text-xs uppercase tracking-widest flex items-center justify-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                Restricted Access Portal
            </p>
        </div>
        
        <form id="authForm" class="space-y-6">
            <div>
                <label class="block text-gray-400 text-sm mb-2 font-mono">Operator ID (Email)</label>
                <input type="email" id="email" required autocomplete="off" class="w-full bg-[#0d1117] text-green-400 font-mono text-sm p-3 rounded border border-gray-700 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-inner" placeholder="admin@enterprise.com">
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-2 font-mono">Passcode</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full bg-[#0d1117] text-green-400 font-mono text-sm p-3 pr-12 rounded border border-gray-700 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition-all shadow-inner" placeholder="••••••••">
                    <button type="button" id="togglePasswordBtn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-500 hover:text-green-400 transition-colors" aria-label="Toggle password visibility">
                        <svg id="eyeIcon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        <svg id="eyeSlashIcon" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-gradient-to-r from-green-600 to-blue-600 hover:from-green-500 hover:to-blue-500 text-white font-bold py-3 px-4 rounded shadow-lg hover:shadow-green-500/20 transition-all duration-300 font-mono tracking-wide">
                AUTHORIZE ACCESS
            </button>
        </form>
        
        <div id="errorMsg" class="hidden mt-4 text-center text-red-500 font-mono text-sm"></div>
        <div id="successMsg" class="hidden mt-4 text-center text-green-500 font-mono text-sm"></div>
        
        <div class="mt-6 text-center text-sm text-gray-500 font-mono">
            <p id="toggleText">New operative? <a href="#" id="toggleBtn" class="text-blue-400 hover:text-blue-300 transition-colors">Create an account</a></p>
        </div>
    </div>

    <script>
    // ==========================================
    // BILLION-DOLLAR ENTERPRISE TOAST SYSTEM
    // ==========================================
    function showToast(message, type="success") {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-emerald-500' : (type === 'error' ? 'bg-rose-500' : 'bg-gray-800');
        toast.className = `min-w-[280px] pointer-events-auto p-4 rounded-xl shadow-2xl text-white text-sm font-semibold tracking-wide transition-all duration-300 transform translate-x-full opacity-0 flex items-center justify-between ${bgColor} border border-white/10 backdrop-blur-md`;
        
        const icon = type === 'success' ? '<svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>' : (type === 'error' ? '<svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>' : '');
        
        toast.innerHTML = `<div class="flex items-center">${icon} <span>${message}</span></div> <button onclick="this.parentElement.remove()" class="text-white/60 hover:text-white transition-colors ml-4 focus:outline-none">&times;</button>`;
        
        container.appendChild(toast);
        
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            });
        });
        
        setTimeout(() => {
            toast.classList.add('translate-x-full', 'opacity-0');
            setTimeout(() => toast.remove(), 300);
        }, 4000);
    }
    
    // Globally override primitive alert
    window.alert = function(msg) {
        if (!msg) return;
        const lowerMsg = String(msg).toLowerCase();
        if (lowerMsg.includes('error') || lowerMsg.includes('fail') || lowerMsg.includes('invalid') || lowerMsg.includes('please')) {
            showToast(msg, 'error');
        } else {
            showToast(msg, 'success');
        }
    };
        const initialToken = localStorage.getItem('token');
        if (initialToken) {
            fetch('/api/me', { headers: { 'Authorization': 'Bearer ' + initialToken } })
                .then(res => {
                    if (res.ok) {
                        window.location.replace('/dashboard');
                    } else {
                        localStorage.removeItem('token');
                    }
                })
                .catch(() => {
                    localStorage.removeItem('token');
                });
        }
        let isLogin = true;
        const toggleText = document.getElementById('toggleText');
        const authForm = document.getElementById('authForm');
        const submitBtn = authForm.querySelector('button[type="submit"]');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');
        
        const passwordInput = document.getElementById('password');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeSlashIcon = document.getElementById('eyeSlashIcon');
        
        togglePasswordBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            eyeIcon.classList.toggle('hidden');
            eyeSlashIcon.classList.toggle('hidden');
        });

        function setupToggleListener() {
            document.getElementById('toggleBtn').addEventListener('click', (e) => {
                e.preventDefault();
                isLogin = !isLogin;
                if (isLogin) {
                    submitBtn.textContent = 'AUTHORIZE ACCESS';
                    toggleText.innerHTML = `New operative? <a href="#" id="toggleBtn" class="text-blue-400 hover:text-blue-300 transition-colors">Create an account</a>`;
                } else {
                    submitBtn.textContent = 'REGISTER OPERATOR';
                    toggleText.innerHTML = `Already registered? <a href="#" id="toggleBtn" class="text-blue-400 hover:text-blue-300 transition-colors">Access Portal</a>`;
                }
                setupToggleListener();
            });
        }
        setupToggleListener();

        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.classList.add('hidden');
            successMsg.classList.add('hidden');
            submitBtn.disabled = true;
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const endpoint = isLogin ? '/api/login' : '/api/signup';

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    errorMsg.innerText = data.detail;
                    errorMsg.classList.remove('hidden');
                } else {
                    localStorage.setItem('token', data.token);
                    if (!isLogin) {
                        alert("Account created successfully!");
                    }
                    window.location.replace('/dashboard');
                }
            } catch (err) {
                errorMsg.textContent = 'Network error. Core systems offline.';
                errorMsg.classList.remove('hidden');
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
