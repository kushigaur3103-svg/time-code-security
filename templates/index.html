<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TimeCodeSecurity | Enterprise AI Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom Dark Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #0d1117; 
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: #30363d; 
            border-radius: 8px;
            border: 2px solid #0d1117;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b949e; 
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
        }
    </style>
</head>
<body class="bg-[#030712] text-white font-sans min-h-screen flex flex-col items-center py-12 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-[#030712] to-[#030712]">
    
    <!-- Header -->
    <div class="text-center mb-10">
        <h1 class="text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-400 to-cyan-500 mb-3 tracking-tight glow-text">
            TimeCodeSecurity
        </h1>
        <p class="text-gray-400 text-sm tracking-[0.3em] uppercase font-semibold">Enterprise Deep Scan Interface</p>
    </div>

    <!-- Main Dashboard -->
    <div class="max-w-5xl w-full px-6">
        <div class="bg-gray-900/80 backdrop-blur-xl border border-gray-700/50 rounded-2xl shadow-2xl p-8">
            
            <!-- Input Section -->
            <div class="mb-5 flex justify-between items-end">
                <h2 class="text-xl font-bold text-gray-200 flex items-center gap-2">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                    Target Source Code
                </h2>
                <div class="flex items-center gap-2 bg-emerald-900/20 border border-emerald-800/50 px-3 py-1.5 rounded-full">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span class="text-xs text-emerald-400 font-mono tracking-wide">System Online</span>
                </div>
            </div>
            
            <div class="flex items-center gap-4 w-full mt-2 mb-2">
                <input type="file" id="fileUpload" accept=".py,.js,.html,.css,.java,.cpp,.c,.txt" class="hidden">
                <button id="uploadBtn" onclick="document.getElementById('fileUpload').click()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs py-1.5 px-3 rounded border border-gray-700 transition-colors flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Upload File (.py, .js, .txt)
                </button>
            </div>

            <textarea id="codeInput" spellcheck="false" class="w-full h-[320px] bg-[#0d1117] text-emerald-400 font-mono text-sm leading-relaxed p-5 rounded-xl border border-gray-700/80 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-all resize-none shadow-inner" placeholder="// Paste your code here for vulnerability analysis..."></textarea>
            
            <!-- Scan Button -->
            <button id="scanBtn" class="mt-8 w-full bg-gradient-to-r from-emerald-500 to-cyan-600 hover:from-emerald-400 hover:to-cyan-500 text-white font-bold py-4 px-4 rounded-xl shadow-[0_0_20px_rgba(16,185,129,0.3)] hover:shadow-[0_0_30px_rgba(16,185,129,0.5)] transition-all duration-300 flex justify-center items-center gap-3 tracking-wide">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                INITIATE DEEP SCAN
            </button>

            <!-- Report Section (Hidden by default) -->
            <div id="reportContainer" class="mt-10 hidden animate-fade-in">
                <h3 class="text-xl font-bold text-gray-200 mb-4 flex items-center gap-2">
                    <svg class="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    AI Analysis Report
                </h3>
                <div id="scanResult" class="bg-[#0a0d14] text-gray-300 font-mono text-sm p-6 rounded-xl border border-gray-700/80 whitespace-pre-wrap leading-relaxed shadow-inner overflow-x-auto"></div>
            </div>

        </div>
    </div>
<script>
    const scanBtn = document.getElementById('scanBtn');
    const codeInput = document.getElementById('codeInput');
    const reportContainer = document.getElementById('reportContainer');
    const scanResult = document.getElementById('scanResult');

    scanBtn.addEventListener('click', async () => {
        const code = codeInput.value.trim();
        if (!code) {
            alert("Please enter some code to scan!");
            return;
        }

        // Loading State
        scanBtn.disabled = true;
        scanBtn.innerHTML = `
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            ANALYZING CODE...
        `;
        reportContainer.classList.add('hidden');
        scanResult.textContent = "";

        try {
            const response = await fetch('/scan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code: code })
            });
            
            const data = await response.json();
            
            if (data.error) {
                scanResult.textContent = "Error: " + data.error;
                scanResult.classList.add("text-red-400");
            } else {
                scanResult.textContent = data.result;
                scanResult.classList.remove("text-red-400");
            }
            
            reportContainer.classList.remove('hidden');
        } catch (error) {
            scanResult.textContent = "System Failure: Could not reach the backend.";
            scanResult.classList.add("text-red-400");
            reportContainer.classList.remove('hidden');
        } finally {
            // Reset Button
            scanBtn.disabled = false;
            scanBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
                INITIATE DEEP SCAN
            `;
        }
    });

    document.getElementById('fileUpload').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const reader = new FileReader();
        reader.onload = function(event) {
            document.getElementById('codeInput').value = event.target.result;
        };
        reader.readAsText(file);
    });
</script>
</body>
</html>
