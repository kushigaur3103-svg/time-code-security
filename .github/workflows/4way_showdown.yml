name: 4-way showdown (TCS vs Semgrep vs Bandit vs SonarQube)

# Manual dispatch only — never triggers on push/PR. All four analyzers run on the
# GitHub runner; the laptop is only used to read the printed scorecard.
on:
  workflow_dispatch:
    inputs:
      tcs_mode:
        description: "TCS execution mode in the harness"
        type: choice
        required: false
        default: api
        options: [api, cli]

permissions:
  contents: read

jobs:
  showdown:
    runs-on: ubuntu-latest
    # SonarQube is NOT a native `services:` container: its embedded Elasticsearch fails
    # the VM bootstrap check (vm.max_map_count) unless the host kernel is tuned first,
    # and services boot before any step can run sysctl. So we tune, then `docker run`
    # the server ourselves and poll until the web API reports UP.

    steps:
      - uses: actions/checkout@v4

      - name: Tune Linux kernel for Elasticsearch
        run: |
          sudo sysctl -w vm.max_map_count=262144
          sudo sysctl -w fs.file-max=131072

      - name: Start SonarQube Container
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            --ulimit nofile=131072:131072 \
            sonarqube:community

      - name: Wait for SonarQube to be UP
        run: |
          for i in $(seq 1 60); do
            if curl -s http://localhost:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "SonarQube is UP after $((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::SonarQube did not reach UP state in 300s — dumping container logs"
          docker logs --tail 200 sonarqube
          exit 1

      - name: Change default admin password and generate token
        id: sonar_auth
        run: |
          # 1. Change default admin password from 'admin' to 'NewAdminPassword123!'
          curl -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=NewAdminPassword123!"

          # 2. Generate analysis user token
          TOKEN_RESPONSE=$(curl -u admin:NewAdminPassword123! -X POST "http://localhost:9000/api/user_tokens/generate?name=github-runner-token")
          echo "TOKEN_RESPONSE: $TOKEN_RESPONSE"
          SONAR_TOKEN=*** "$TOKEN_RESPONSE" | jq -r '.token')
          if [ -z "$SONAR_TOKEN" ] || [ "$SONAR_TOKEN" = "null" ]; then
            echo "::error::Failed to generate SonarQube user token"
            exit 1
          fi

          # 3. Export token as environment variable
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install competitors
        run: |
          python -m pip install --upgrade pip
          pip install semgrep bandit

      - name: Install SonarScanner CLI
        run: |
          curl -sSLo /tmp/sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
          unzip -q /tmp/sonar.zip -d /opt
          echo "/opt/sonar-scanner-5.0.1.3006-linux/bin" >> "$GITHUB_PATH"

      - name: Mirror benchmark corpora
        run: python scripts/setup_python_benchmark.py

      - name: Run SonarQube analysis over external corpora
        run: |
          sonar-scanner \
            -Dsonar.projectKey=tcs-showdown \
            -Dsonar.sources=external \
            -Dsonar.inclusions="**/*.py" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="${SONAR_TOKEN}" \
            -Dsonar.scm.disabled=true \
            -Dsonar.qualitygate.wait=true

      - name: Wait for compute engine and export issue JSON
        run: |
          mkdir -p scratch
          for i in $(seq 1 60); do
            curl -sf -u "${SONAR_TOKEN}:" "http://localhost:9000/api/ce/activity?status=SUCCESS&componentKeys=tcs-showdown" >/dev/null && break
            sleep 5
          done
          curl -sf -u "${SONAR_TOKEN}:" "http://localhost:9000/api/issues/search?componentKeys=tcs-showdown&ps=500&additionalFields=_all" \
            -o scratch/sonar_issues.json
          curl -sf -u "${SONAR_TOKEN}:" "http://localhost:9000/api/hotspots/search?projectKey=tcs-showdown&ps=500" \
            -o scratch/sonar_hotspots.json || echo "[]" > scratch/sonar_hotspots.json

      - name: Run 4-way showdown with Sonar report
        run: |
          python scripts/run_python_showdown.py --stage all \
            --tcs-mode "${{ inputs.tcs_mode }}" \
            --sonar-report scratch/sonar_issues.json | tee scratch/showdown_output.txt

      - name: Publish master table to job summary
        if: always()
        run: |
          echo '## 4-way showdown — master comparison table' >> "$GITHUB_STEP_SUMMARY"
          sed -n '/== MASTER TABLE/,/^$/p' scratch/showdown_output.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Stop SonarQube Container
        if: always()
        run: docker rm -f sonarqube || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showdown-artifacts
          path: |
            reports/python_ground_truth_showdown.md
            scratch/showdown/raw_results.json
            scratch/showdown/scoring.json
            scratch/sonar_issues.json
