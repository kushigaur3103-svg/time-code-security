name: "Benchmark - Boss Arenas 7-in-1 Showdown (Superset / Airflow / Home Assistant / Odoo / Ansible / Transformers / Sentry)"

# Manual only: no push, pull_request, schedule or workflow_run trigger exists in this file, so the
# file itself costs zero runner minutes and every `[skip ci]` commit stays inert until a human picks
# one of the seven boss arenas and presses "Run workflow". One file, seven targets, `arena` selects
# exactly one - this is what keeps the next showdowns off each other's credit bill. The "3-Way"
# wording used by the referee steps below is about the three ENGINES (TimeCodeSecurity / CodeQL /
# Semgrep), not the number of arenas, so it stays 3-Way now that the target list is seven.
on:
  workflow_dispatch:
    inputs:
      arena:
        description: 'Select Boss Arena Target'
        required: true
        default: 'superset'
        type: choice
        options:
          - 'superset'
          - 'airflow'
          - 'homeassistant'
          - 'odoo'
          - 'ansible'
          - 'transformers'
          - 'sentry'

# contents:read clones this repo. security-events:write is what codeql-action expects to see even
# though `upload: false` means no SARIF is ever sent to the code-scanning API.
permissions:
  contents: read
  security-events: write

jobs:
  boss-arena-showdown:
    runs-on: ubuntu-latest
    # Whole-job backstop: clone, Gate 1, all three engines and the referee. The TCS scan itself has
    # no wall-clock wrapper any more - Transformers v4.38 was killed at 2700s while the scan was
    # still writing its profile, so the run has to be allowed to finish. 180 minutes is the
    # replacement backstop: long enough for a full arena scan plus CodeQL, Semgrep and the referee,
    # and well inside GitHub's 360-minute ceiling for a hosted job. If the job itself hits this cap,
    # the scan never finished and the missing artifact is the signal to profile the collector that
    # was still running.
    #
    # Nothing here skips, excludes or caps the corpus: a skipped file would be a false negative,
    # which is the one outcome these runs exist to rule out. The Setup step still prints
    # `TARGET_PY_COUNT` and warns when an arena exceeds Home Assistant's 10,648 .py files, the only
    # measured yardstick this repo owns.
    timeout-minutes: 180

    env:
      PYTHONUNBUFFERED: "1"
      # The dispatched choice travels through the environment instead of being interpolated into a
      # shell string, so the value cannot become a command.
      ARENA: ${{ github.event.inputs.arena }}
      TARGET_DIR: target_arena

    steps:
      - name: Checkout TimeCodeSecurity (HEAD)
        uses: actions/checkout@v4

      # Provenance first, and hard-checked. A 30-minute arena run that cannot say which commit it
      # executed is worthless for attribution: the 2026-10-16 Home Assistant run was read as "the
      # Phase 2 branch" while `github.head_branch`/`head_sha` on that run said `main` @ 69f398cae,
      # and the missing `[PROFILE]` lines were the only symptom. `actions/checkout@v4` with no `ref:`
      # input follows `github.sha` - the ref picked in the "Run workflow" dialog - so the only way
      # old code runs is an old ref being dispatched. This step makes that impossible to mistake:
      # it prints the dispatch ref/sha, the checkout's own `git rev-parse HEAD`, and fails the job if
      # the two disagree. Nothing here echoes a secret: no env dump, no token, no `inputs` beyond the
      # arena name already visible in the run title.
      - name: Benchmark Provenance (which code is about to run)
        run: |
          mkdir -p benchmark_results
          {
            echo "dispatch ref            : ${{ github.ref }}"
            echo "dispatch sha            : ${{ github.sha }}"
            echo "checked out HEAD        : $(git rev-parse HEAD)"
            echo "checked out branch      : $(git rev-parse --abbrev-ref HEAD)"
            echo "HEAD commit subject     : $(git log -1 --pretty=%s)"
            echo "workflow file           : ${{ github.workflow }} (from ${{ github.ref }})"
            echo "run id / attempt        : ${{ github.run_id }} / ${{ github.run_attempt }}"
            echo "trigger event           : ${{ github.event_name }}"
            echo "arena input             : ${ARENA:-}"
            echo "python                  : $(python --version 2>&1)"
            echo "runner                  : ${{ runner.name }} (${{ runner.os }})"
            echo "scan command            : python -u cli.py scan ${TARGET_DIR}/ --scope all --format json --sarif benchmark_results/tcs.sarif"
          } | tee benchmark_results/provenance.txt
          test "$(git rev-parse HEAD)" = "${{ github.sha }}" || {
            echo "::error::checkout HEAD is not the dispatched sha - this run would score the wrong commit"
            exit 1
          }
          echo "TCS_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "TCS_HEAD_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Engine Dependencies
        # requirements.txt first: Gate 1 and `python cli.py scan` both import from it.
        # flet is not in requirements.txt, but `scripts/run_all_checks.py` imports tcs_gui, whose
        # line 6 is `import flet as ft` - without it Gate 1 dies on ModuleNotFoundError (measured on
        # the universal showdown before the same line was added there).
        run: |
          mkdir -p benchmark_results
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flet
          python -c "import flet, tcs_gui; print('gate imports OK')"

      - name: Setup Target Arena (shallow, single branch, .git removed)
        # Refs verified 2026-10-13 with `git ls-remote --tags` before this file was written:
        # apache/superset 3.0.0 = 40d9c4c, apache/airflow 2.7.3 = f124353,
        # home-assistant/core 2023.11.0 = 0b8d423. All three are tags, so `--branch` resolves them.
        # The two arenas added 2026-10-23 and the two added 2026-10-24 were verified the same way,
        # from this machine, before the edit: `git ls-remote --heads
        # https://github.com/odoo/odoo.git 17.0` -> refs/heads/17.0 =
        # dca5cd22d40f25066919d722bf687be48c51b0ec (a BRANCH, not a tag - Odoo ships per-version
        # branches); `git ls-remote --tags https://github.com/ansible/ansible.git v2.16.5` ->
        # refs/tags/v2.16.5 = ee04df4796af1a438bc80aff33cdd5ca4d5304aa (annotated tag);
        # `git ls-remote --tags https://github.com/huggingface/transformers.git v4.38.0` ->
        # refs/tags/v4.38.0 = 08ab54ada594f8f4cc1e458b1217bf8c53f04dd8 (peeled commit of an
        # annotated tag); and `git ls-remote --tags https://github.com/getsentry/sentry.git 24.2.0`
        # -> refs/tags/24.2.0 = cfcff1f4fda857dcddc9401efb689b6af92a3214 (lightweight tag).
        # `--branch` accepts either form, which is why one flag covers all seven arenas. Pinned,
        # never `latest` or a moving default branch: a re-dispatch must land on the same revision or
        # the numbers cannot be compared file-for-file with this run.
        # An empty $ARENA is the one input no pattern can match, so it is caught here with a plain
        # message instead of surfacing later as a confusing `git clone` exit 1.
        run: |
          if [ -z "$ARENA" ]; then
            echo "::error::arena is empty - run this workflow again and pick a target" >&2
            exit 1
          fi
          case "$ARENA" in
            superset)
              REPO="https://github.com/apache/superset.git"
              REF="3.0.0"
              LABEL="apache/superset @ 3.0.0 (Flask + Celery + SQLAlchemy analytics BI)"
              ;;
            airflow)
              REPO="https://github.com/apache/airflow.git"
              REF="2.7.3"
              LABEL="apache/airflow @ 2.7.3 (FastAPI + SQLAlchemy + Celery orchestrator)"
              ;;
            homeassistant)
              REPO="https://github.com/home-assistant/core.git"
              REF="2023.11.0"
              LABEL="home-assistant/core @ 2023.11.0 (aiohttp + ~4k modules, 1800+ integrations)"
              ;;
            odoo)
              REPO="https://github.com/odoo/odoo.git"
              REF="17.0"
              LABEL="odoo/odoo @ 17.0 (ORM + Werkzeug RPC, per-version branch, whole addons tree)"
              ;;
            ansible)
              REPO="https://github.com/ansible/ansible.git"
              REF="v2.16.5"
              LABEL="ansible/ansible @ v2.16.5 (CLI + module tree, jinja2 templating, ansible-core split across lib/)"
              ;;
            transformers)
              REPO="https://github.com/huggingface/transformers.git"
              REF="v4.38.0"
              LABEL="huggingface/transformers @ v4.38.0 (Hugging Face Transformers: AI models, dynamic dispatch, serialization)"
              ;;
            sentry)
              REPO="https://github.com/getsentry/sentry.git"
              REF="24.2.0"
              LABEL="getsentry/sentry @ 24.2.0 (Sentry: monolithic architecture, custom query builders, data pipelines)"
              ;;
            *)
              echo "::error::Unknown arena: $ARENA" >&2
              exit 1
              ;;
          esac
          git clone --depth 1 --single-branch --branch "$REF" "$REPO" "$TARGET_DIR"
          # The tag name alone is not a revision: `2023.11.0` is recorded here as the SHA the runner
          # actually cloned, so a later re-dispatch can be compared file-for-file with this run.
          # Read BEFORE `.git` is deleted, because after that there is nothing left to ask.
          TARGET_SHA=$(git -C "$TARGET_DIR" rev-parse HEAD)
          echo "target clone sha        : $TARGET_SHA ($REPO @ $REF)" >> benchmark_results/provenance.txt
          # Removing .git frees the object store before any engine reads the tree, and stops the
          # walkers from descending into it.
          rm -rf "$TARGET_DIR/.git"
          {
            echo "REPO=$REPO"
            echo "REF=$REF"
            echo "TARGET_REF_USED=$REF"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "ARENA_LABEL=$LABEL"
            echo "TARGET_PY_FILES=$(find "$TARGET_DIR" -name '*.py' | wc -l)"
            echo "TARGET_HTML_FILES=$(find "$TARGET_DIR" -name '*.html' | wc -l)"
          } >> "$GITHUB_ENV"
          echo "arena=$ARENA -> $REPO @ $REF ($TARGET_SHA)"
          echo "python files: $(find "$TARGET_DIR" -name '*.py' | wc -l)"
          find "$TARGET_DIR" -type f | sort > benchmark_results/target_files.txt
          echo "arena files: $(wc -l < benchmark_results/target_files.txt)"
          # Sizing tripwire, printed BEFORE the scan starts so an oversized arena is visible in the
          # job log instead of only in a 180-minute job timeout. The yardstick is the number this file
          # already carries for Home Assistant Core: 10,648 python files completed after the
          # collectors were parallelised. Odoo's per-version branch is a far larger tree, so it is
          # warned about explicitly - nothing is skipped, excluded or capped here, because a skipped
          # file would be a false negative. If the warning fires and the scan still finishes, the job
          # cap was simply generous; if it fires and the job dies, raise `timeout-minutes` rather than
          # trimming the corpus.
          PY_COUNT=$(find "$TARGET_DIR" -name '*.py' | wc -l)
          echo "TARGET_PY_COUNT=$PY_COUNT" >> "$GITHUB_ENV"
          echo "TARGET_PY_COUNT=$PY_COUNT" >> benchmark_results/provenance.txt
          if [ "$PY_COUNT" -gt 10648 ]; then
            echo "::warning::arena $ARENA has $PY_COUNT .py files - more than the 10,648 of Home" \
              "Assistant Core that the 180 minute job cap was sized for; expect a longer run and" \
              "check the cgroup peak before trusting a partial result"
          fi

      - name: Gate 1 Hard Verification (prerequisite, 552 cases)
        # No "|| true" and no continue-on-error: a red engine makes every number in the report
        # worthless, so the job stops before a third-party tool is run. Actions runs the shell with
        # `bash -eo pipefail`, so a non-zero gate fails the step through the tee pipe.
        run: |
          python scripts/run_all_checks.py 2>&1 | tee benchmark_results/gate1.txt
          grep -Eq "Cases Evaluated[[:space:]]*:[[:space:]]*552" benchmark_results/gate1.txt
          grep -Eq "False Positives[[:space:]]*:[[:space:]]*0" benchmark_results/gate1.txt
          grep -Eq "False Negatives[[:space:]]*:[[:space:]]*0" benchmark_results/gate1.txt
          echo "GATE1_PASSED=true" >> "$GITHUB_ENV"

      - name: Execute TimeCodeSecurity Scan (no wall-clock guard)
        # No `timeout` wrapper: the Transformers v4.38 run was killed at 2700s while the scan was
        # still writing its `[PROFILE]` lines, which destroyed the evidence this step exists to
        # capture. The scan now runs to completion (or to the 180-minute job backstop). No call site
        # is skipped, so the corpus still costs a full resolution - the engine's own collectors must
        # account for that time in the profile, not a wrapper silently truncate it.
        #
        # One merged log, two readers. `2>&1 | tee` puts stdout and stderr in the same file - every
        # `[PROFILE]` line the engine writes goes to stderr, so a stdout-only capture would have
        # hidden the timings that this whole step exists to produce - and the same text lands in the
        # job log, so the numbers are readable without downloading the artifact. The real exit code
        # comes from `PIPESTATUS[0]`, NOT from the pipeline: with Actions' default `bash -eo pipefail`
        # a `tee` at the end of the pipe would abort the step before `TCS_SCAN_EXIT` is recorded, and
        # the referee would then say "not recorded" instead of naming the code. `set +e` around the
        # scan is what keeps that bookkeeping honest.
        continue-on-error: true
        run: |
          echo "TCS commit about to be scored: $(git rev-parse --short HEAD)"
          {
            echo "--- scan started $(date -u +%FT%TZ) on $(git rev-parse HEAD) ---"
            echo "command: python -u cli.py scan $TARGET_DIR/ --scope all --format json --sarif benchmark_results/tcs.sarif"
          } >> benchmark_results/tcs_stdout.txt
          # Whole-tree memory accounting, cgroup v2. The engine itself has no cgroup code (verified:
          # `grep -rn "cgroup" --include=*.py` over the repo excluding scratch/ returns nothing), so the
          # runner is the only place that can see the kernel's own high-water mark. `memory.peak` is
          # maintained by the kernel for the whole cgroup, and `cgroup.procs` is the proof that the
          # process being sampled really belongs to that cgroup - without that check a peak could be
          # attributed to a sibling that never ran the scan. `/proc/self/cgroup` gives the relative
          # path (`0::/` on a runner sitting in the root), and if `memory.peak` is not under it the
          # fallback is the unified root; if neither has the file the sampler says so in the log
          # instead of inventing a number. Sampled in a background loop so the peak is attributable to
          # the scan window, not to the 15 minutes of clone + Gate 1 that precede it.
          CG_REL=$(awk -F: '$1=="0"{print $3}' /proc/self/cgroup 2>/dev/null || echo "")
          CG_DIR="/sys/fs/cgroup${CG_REL}"
          [ -f "$CG_DIR/memory.peak" ] || CG_DIR="/sys/fs/cgroup"
          CG_MEM_LOG=benchmark_results/cgroup_mem.log
          {
            echo "--- cgroup v2 sampler ---"
            echo "self cgroup     : $(cat /proc/self/cgroup 2>/dev/null | tr '\n' ' ')"
            echo "cgroup dir      : $CG_DIR"
            echo "memory.peak     : $(cat "$CG_DIR/memory.peak" 2>/dev/null || echo ABSENT)"
            echo "cgroup.procs    : $(wc -l < "$CG_DIR/cgroup.procs" 2>/dev/null || echo ABSENT)"
            echo "cgroup controllers: $(cat "$CG_DIR/cgroup.controllers" 2>/dev/null || echo ABSENT)"
          } > "$CG_MEM_LOG"
          if [ ! -f "$CG_DIR/memory.peak" ]; then
            echo "memory.peak NOT AVAILABLE under $CG_DIR (cgroup v1 or hidden)" >> "$CG_MEM_LOG"
          fi
          (
            while :; do
              _cur=$(cat "$CG_DIR/memory.current" 2>/dev/null || echo na)
              _pk=$(cat "$CG_DIR/memory.peak" 2>/dev/null || echo na)
              _pid=$(pgrep -f "cli.py scan" 2>/dev/null | head -1)
              _in=na; [ -n "$_pid" ] && { grep -qw "$_pid" "$CG_DIR/cgroup.procs" 2>/dev/null && _in=yes || _in=no; }
              _n=$(wc -l < "$CG_DIR/cgroup.procs" 2>/dev/null || echo na)
              echo "$(date -u +%FT%TZ) current=${_cur} peak=${_pk} scan_pid=${_pid:-none} in_cgroup.procs=${_in} procs=${_n}"
              sleep 15
            done
          ) >> "$CG_MEM_LOG" 2>&1 &
          CG_SAMPLER=$!
          set +e
          python -u cli.py scan "$TARGET_DIR/" --scope all --format json \
              --sarif benchmark_results/tcs.sarif \
            2>&1 | tee -a benchmark_results/tcs_stdout.txt
          TCS_CODE=${PIPESTATUS[0]}
          set -e
          kill "$CG_SAMPLER" 2>/dev/null || true
          wait "$CG_SAMPLER" 2>/dev/null || true
          echo "TCS_SCAN_EXIT=$TCS_CODE" >> "$GITHUB_ENV"
          # The last sample after the scan is the one that carries the run's high-water mark; `peak` is
          # monotonic, so tail -1 is enough. Recorded into the environment for the artifact step and for
          # the report, and kept as raw bytes so nobody has to guess the unit.
          CG_FINAL_PEAK=$(grep -o 'peak=[0-9]*' "$CG_MEM_LOG" 2>/dev/null | tail -1 | cut -d= -f2 || echo "")
          echo "CGROUP_DIR=$CG_DIR" >> "$GITHUB_ENV"
          echo "CGROUP_PEAK_BYTES=${CG_FINAL_PEAK:-0}" >> "$GITHUB_ENV"
          echo "----- cgroup v2 sampler (first / last / peak) -----"
          head -6 "$CG_MEM_LOG"
          grep -c 'current=' "$CG_MEM_LOG" 2>/dev/null || true
          tail -2 "$CG_MEM_LOG"
          echo "cgroup peak bytes = ${CG_FINAL_PEAK:-unknown}"
          echo "----- forensics extract (also saved to benchmark_results/tcs_profile.txt) -----"
          grep -E "\[PROFILE\]|\[GOVERNOR\]|\[TIMEOUT\]|timeout skipped|skipping unparseable|\[PARSER-MODE\]|\[RESCUED|\[SINKGATE\]|\[progress\]|Traceback|MemoryError" \
            benchmark_results/tcs_stdout.txt > benchmark_results/tcs_profile.txt || true
          wc -l < benchmark_results/tcs_profile.txt
          head -c 4000 benchmark_results/tcs_profile.txt
          echo
          # Tripwire, not a guess: the engine's stage timers all share the `[PROFILE]` prefix, so a
          # revision that genuinely has them cannot produce zero matches. If this prints, the scan
          # ran code without the instrumentation - which is exactly the question this run had to ask.
          # The pattern is the label the clock actually prints (`[PROFILE] Outer(scan): ... TOTAL=`),
          # verified against scratch/_p3_new_err1.txt rather than remembered.
          if ! grep -q "\[PROFILE\] Outer" benchmark_results/tcs_stdout.txt; then
            echo "::warning::no '[PROFILE] Outer' stage-timer line in the log - the checked-out revision ($(git rev-parse --short HEAD)) does not emit the instrumentation"
          fi

      - name: Materialise Named Arena Artifacts (scan_profile.log / arena_result.json / arena_result.sarif)
        if: always()
        # Three fixed names, whatever the arena. `run: |` blocks execute before the upload step and
        # `if: always()` means a scan that failed or was killed still produces them, so a failed
        # arena is still auditable instead of leaving an empty artifact.
        #
        # Where each one comes from, stated plainly because it matters for how much to trust it:
        #   arena_result.sarif - a byte copy of benchmark_results/tcs.sarif, the engine's own SARIF.
        #   arena_result.json  - DERIVED from that SARIF, not the engine's stdout. `python cli.py scan`
        #                        has no JSON-file flag (`--sarif` is the only path writer and
        #                        `--format json` prints to stdout, mixed with the stderr telemetry that
        #                        this step must not swallow), so re-running the scan just to get a JSON
        #                        file would double the scan's bill. The file says so in its own
        #                        "source" key.
        #   scan_profile.log   - the [PROFILE] / [GOVERNOR] extract, the engine's own peakRSS lines,
        #                        and the cgroup v2 sampler output, in one readable file.
        run: |
          set +e
          cp benchmark_results/tcs.sarif benchmark_results/arena_result.sarif 2>/dev/null
          if [ -s benchmark_results/arena_result.sarif ]; then
            echo "arena_result.sarif <- tcs.sarif ($(wc -c < benchmark_results/arena_result.sarif) bytes)"
          else
            echo "arena_result.sarif MISSING: the scan produced no SARIF (exit ${TCS_SCAN_EXIT:-not-recorded})"
          fi
          {
            echo "=== arena ==="
            echo "arena              : ${ARENA:-n/a}"
            echo "label              : ${ARENA_LABEL:-n/a}"
            echo "repo / ref         : ${REPO:-n/a} @ ${REF:-n/a}"
            echo "target clone sha   : ${TARGET_SHA:-n/a}"
            echo "py files / all     : ${TARGET_PY_COUNT:-n/a} / $(wc -l < benchmark_results/target_files.txt 2>/dev/null || echo n/a)"
            echo "=== engine ==="
            echo "tcs commit scored  : ${TCS_HEAD_SHA:-n/a}"
            echo "tcs scan exit      : ${TCS_SCAN_EXIT:-not-recorded}"
            echo "scan cap / job cap : none / 180m"
            echo "=== stage timers and governor lines ==="
            cat benchmark_results/tcs_profile.txt 2>/dev/null || echo "(no [PROFILE] lines extracted)"
            echo "=== engine-reported peak RSS ==="
            grep -o "peakRSS_parent=[0-9]*MB" benchmark_results/tcs_stdout.txt 2>/dev/null | sort -u
            echo "=== cgroup v2 whole-tree memory ==="
            cat benchmark_results/cgroup_mem.log 2>/dev/null || echo "(no cgroup samples recorded)"
          } > benchmark_results/scan_profile.log 2>&1
          echo "scan_profile.log     $(wc -c < benchmark_results/scan_profile.log) bytes"
          python - << 'PY'
          import json
          import os
          import re

          src = "benchmark_results/tcs.sarif"
          peak = int(os.environ.get("CGROUP_PEAK_BYTES") or 0)
          out = {
              "arena": os.environ.get("ARENA", "n/a"),
              "arena_label": os.environ.get("ARENA_LABEL", "n/a"),
              "repo": os.environ.get("REPO", "n/a"),
              "ref": os.environ.get("TARGET_REF_USED", os.environ.get("REF", "n/a")),
              "target_sha": os.environ.get("TARGET_SHA", "n/a"),
              "tcs_head_sha": os.environ.get("TCS_HEAD_SHA", os.environ.get("GITHUB_SHA", "n/a")),
              "tcs_scan_exit": os.environ.get("TCS_SCAN_EXIT", "not-recorded"),
              "target_py_files": int(os.environ.get("TARGET_PY_COUNT") or -1),
              "source": ("derived from benchmark_results/tcs.sarif; `python cli.py scan --format json` "
                         "writes JSON to stdout only and the scan log merges stdout with stderr, so no "
                         "lossless JSON file exists to copy. Engine code is frozen: nothing was re-run."),
              "memory": {
                  "cgroup_dir": os.environ.get("CGROUP_DIR", "n/a"),
                  "memory_peak_bytes": peak,
                  "memory_peak_mb": round(peak / 1048576.0, 1) if peak else None,
                  "cgroup_samples_log": "benchmark_results/cgroup_mem.log",
                  "note": ("memory.peak is the kernel's high-water mark for the whole cgroup, so it "
                           "covers clone, Gate 1, the scan and the other engines - not the scan alone. "
                           "For the scan process itself read the engine's own peakRSS_parent lines in "
                           "scan_profile.log."),
              },
              "counts": {},
              "findings": [],
          }
          cwe_re = re.compile(r"\bcwe[/\s-]?(\d{1,4})\b", re.I)


          def cwe_numbers(*values):
              """Same rules as the referee's _cwe_numbers below: walk strings, lists and dicts,
              keep 0 < n < 10000. Re-implemented here rather than imported because the referee is a
              later step in this same file and its function is not importable from a `run:` block."""
              found = set()
              stack = list(values)
              while stack:
                  item = stack.pop()
                  if isinstance(item, str):
                      for match in cwe_re.finditer(item):
                          number = int(match.group(1))
                          if 0 < number < 10000:
                              found.add(number)
                  elif isinstance(item, (list, tuple, set)):
                      stack.extend(item)
                  elif isinstance(item, dict):
                      stack.extend(item.values())
              return found


          try:
              with open(src, encoding="utf-8") as handle:
                  data = json.load(handle)
          except (OSError, ValueError) as exc:
              out["counts"] = {"status": f"SARIF unreadable: {type(exc).__name__}"}
              print("arena_result.json: SARIF missing or unreadable -> counts.status records it")
          else:
              files, cwes, rules = set(), set(), set()
              for run_obj in data.get("runs", []):
                  driver = run_obj.get("tool", {}).get("driver", {})
                  rule_list = driver.get("rules", []) or []
                  for rule in rule_list:
                      rules.add(rule.get("id", ""))
                  # Join on ruleId, not ruleIndex: Semgrep OSS SARIF carries `ruleIndex: None`, so an
                  # index lookup loses every CWE stored in the rule metadata. Without this join a
                  # finding whose only CWE is in `rules[].properties` would be reported as cwe=None.
                  catalog = {rule.get("id"): rule for rule in rule_list
                             if isinstance(rule, dict) and rule.get("id")}
                  for res in run_obj.get("results", []) or []:
                      rule = catalog.get(res.get("ruleId", "")) or {}
                      uri, line = "?", 0
                      for loc in res.get("locations", []) or []:
                          place = loc.get("physicalLocation", {})
                          uri = place.get("artifactLocation", {}).get("uri", "?")
                          line = (place.get("region", {}) or {}).get("startLine", 0) or 0
                          break
                      hits = cwe_numbers(
                          res.get("ruleId"), res.get("rule"),
                          (res.get("properties") or {}).get("cwe"),
                          (res.get("properties") or {}).get("tags"),
                          (rule.get("properties") or {}).get("cwe"),
                          (rule.get("properties") or {}).get("tags"),
                          (rule.get("properties") or {}).get("subcategories"),
                          rule.get("id"), rule.get("name"),
                          (rule.get("shortDescription") or {}).get("text"),
                          rule.get("taxonomies"),
                      )
                      cwe = min(hits) if hits else None
                      if cwe is not None:
                          cwes.add(cwe)
                      files.add(uri)
                      out["findings"].append({"file": uri, "line": line, "cwe": cwe,
                                              "rule": res.get("ruleId", "") or rule.get("id", "") or "?",
                                              "level": res.get("level", ""),
                                              "message": (res.get("message", {}) or {}).get("text", "")[:200]})
              out["counts"] = {"status": "ok", "runs": len(data.get("runs", [])),
                               "results": len(out["findings"]), "rules": len(rules),
                               "distinct_files": len(files), "distinct_cwes": len(cwes)}
          with open("benchmark_results/arena_result.json", "w", encoding="utf-8") as handle:
              json.dump(out, handle, indent=1, sort_keys=False)
          print(f"arena_result.json rows={len(out['findings'])} counts={out['counts']}")
          PY
          ls -la benchmark_results/scan_profile.log benchmark_results/arena_result.json \
            benchmark_results/arena_result.sarif benchmark_results/cgroup_mem.log 2>&1 | tail -6
          set -e

      - name: Write CodeQL Config (target directory only)
        # Without this, CodeQL analyses the whole workspace, which here means our own 17k-line engine
        # too, and the comparison would not be on identical input. `config-file` and `queries` are
        # mutually exclusive action inputs, so the suite is named inside the config.
        # No `paths-ignore`: TCS and Semgrep get every file of the arena, so hiding the arena's tests
        # from CodeQL alone would invent blind spots for it.
        run: |
          cat > benchmark_results/codeql_config.yml << CFG
          name: "boss arena showdown: $TARGET_DIR only"
          disable-default-queries: true
          queries:
            - uses: security-extended
          paths:
            - $TARGET_DIR
          CFG
          cat benchmark_results/codeql_config.yml

      - name: Initialize CodeQL (python, security-extended, no build)
        uses: github/codeql-action/init@v3
        continue-on-error: true
        with:
          languages: python
          build-mode: none
          config-file: benchmark_results/codeql_config.yml

      - name: Run CodeQL Analysis (no upload)
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
        with:
          category: "/language:python"
          output: benchmark_results/codeql_results
          upload: false
          cleanup-level: none

      - name: Normalise CodeQL SARIF Path
        # The exact SARIF file name inside `output:` is not documented per version, so it is
        # discovered at run time rather than assumed, and then copied to the single name the referee
        # reads. The missing/empty case stays visible instead of becoming "0 findings".
        run: |
          ls -la benchmark_results/codeql_results 2>/dev/null || echo "no codeql output directory"
          CODEQL_SARIF=$(find benchmark_results/codeql_results -name '*.sarif' 2>/dev/null | head -1)
          if [ -n "$CODEQL_SARIF" ]; then
            cp "$CODEQL_SARIF" benchmark_results/codeql.sarif
            echo "codeql sarif -> benchmark_results/codeql.sarif ($(wc -c < benchmark_results/codeql.sarif) bytes)"
          else
            echo "::warning::CodeQL produced no SARIF - the referee will report it as missing, not as zero"
          fi

      - name: Execute Semgrep OSS Scan (p/python + p/owasp-top-ten)
        # pip first, as specified; pipx as the fallback the universal showdown proved is needed when
        # semgrep's own dependency pins clash with the engine tree already installed.
        continue-on-error: true
        run: |
          python -m pip install --quiet semgrep || pipx install semgrep
          semgrep --version
          semgrep scan --config "p/python" --config "p/owasp-top-ten" \
            --metrics=off --sarif \
            --output benchmark_results/semgrep.sarif \
            "$TARGET_DIR/" \
            > benchmark_results/semgrep_stdout.txt 2>&1 \
            || echo "SEMGREP_SCAN_EXIT=$?" >> "$GITHUB_ENV"

      # Boss-arena referee: the same scoreboard that `.github/workflows/benchmark_universal_showdown.yml`
      # runs, reused so these three arenas are directly comparable with saltstack and zulip.
      # (`scripts/generate_showdown_report.py` does not exist in this repo - verified 2026-10-13 -
      # and the canonical referee here is inline so no engine file is touched.)
      # Identical rules for all three engines: one loader, one CWE normalisation, one symmetric join.
      - name: Generate 3-Way Showdown Report
        if: always()
        run: |
          python - << 'PY'
          import json
          import os
          import re

          CWE_RE = re.compile(r"\bcwe[/\s-]?(\d{1,4})\b", re.I)
          ENGINES = ("TimeCodeSecurity", "CodeQL", "Semgrep")
          NORMAL_SCAN_EXITS = {"", "0", "1"}
          # Symmetric join window: two findings belong to the same location when they are in the same
          # file and their start lines are within this many lines of each other. Applied to every
          # engine pair, never one-sided.
          LINE_WINDOW = 5
          MAX_ROWS = 120
          TARGET_DIR = os.environ.get("TARGET_DIR", "target_arena")
          PATHS = {
              "TimeCodeSecurity": "benchmark_results/tcs.sarif",
              "CodeQL": "benchmark_results/codeql.sarif",
              "Semgrep": "benchmark_results/semgrep.sarif",
          }
          EXIT_KEYS = {"TimeCodeSecurity": "TCS_SCAN_EXIT", "CodeQL": "CODEQL_SCAN_EXIT",
                       "Semgrep": "SEMGREP_SCAN_EXIT"}


          def norm_path(uri):
              """Map any tool's URI onto `path/inside/the/arena`, POSIX separators."""
              text = (uri or "").replace("\\", "/").lstrip("./")
              marker = "/" + TARGET_DIR.strip("/") + "/"
              index = text.find(marker)
              if index >= 0:
                  return text[index + len(marker):]
              if text.startswith(TARGET_DIR.strip("/") + "/"):
                  return text[len(TARGET_DIR.strip("/") + "/"):]
              return text


          def _cwe_numbers(*values):
              """Every CWE id in any mix of strings, lists and nested SARIF fragments."""
              found = set()
              stack = list(values)
              while stack:
                  item = stack.pop()
                  if isinstance(item, str):
                      for match in CWE_RE.finditer(item):
                          number = int(match.group(1))
                          if 0 < number < 10000:
                              found.add(number)
                  elif isinstance(item, (list, tuple, set)):
                      stack.extend(item)
                  elif isinstance(item, dict):
                      stack.extend(item.values())
              return found


          def load_sarif(path):
              """(status, data). A missing file is reported as missing, never as zero findings."""
              if not path or not os.path.exists(path):
                  return "no SARIF produced (step failed, timed out or wrote nothing)", {}
              if os.path.getsize(path) == 0:
                  return "SARIF file is empty", {}
              try:
                  with open(path, encoding="utf-8") as handle:
                      return "ok", json.load(handle)
              except (OSError, ValueError) as exc:
                  return f"SARIF unreadable: {type(exc).__name__}", {}


          def rows_of(path):
              """One row per finding: (file, line, cwe, ruleId, category, message)."""
              status, data = load_sarif(path)
              rows = []
              for run in data.get("runs", []):
                  rules = run.get("tool", {}).get("driver", {}).get("rules", []) or []
                  # Join on ruleId: Semgrep OSS SARIF results carry `ruleIndex: None`, so an
                  # index-only lookup loses every CWE stored in the rule metadata.
                  catalog = {rule.get("id"): rule for rule in rules
                             if isinstance(rule, dict) and rule.get("id")}
                  for res in run.get("results", []):
                      rule = catalog.get(res.get("ruleId", "")) or {}
                      uri, line = "?", 0
                      for loc in res.get("locations", []):
                          place = loc.get("physicalLocation", {})
                          uri = norm_path(place.get("artifactLocation", {}).get("uri", uri))
                          line = place.get("region", {}).get("startLine", line) or 0
                          break
                      cwes = _cwe_numbers(
                          res.get("ruleId"), res.get("rule"),
                          (res.get("properties") or {}).get("cwe"),
                          (res.get("properties") or {}).get("tags"),
                          (rule.get("properties") or {}).get("cwe"),
                          (rule.get("properties") or {}).get("tags"),
                          (rule.get("properties") or {}).get("subcategories"),
                          rule.get("id"), rule.get("name"),
                          (rule.get("shortDescription") or {}).get("text"),
                          rule.get("taxonomies"),
                      )
                      category = ((rule.get("shortDescription") or {}).get("text")
                                  or rule.get("name") or "")
                      message = " ".join((res.get("message", {}).get("text", "")
                                          or "").replace("|", "/").split())[:90]
                      rows.append((uri, int(line), min(cwes) if cwes else None,
                                   res.get("ruleId", "") or rule.get("id", "") or "?",
                                   " ".join(category.split())[:48], message))
              return status, sorted(rows, key=lambda row: (row[0], row[1], str(row[2])))


          statuses, findings = {}, {}
          for engine in ENGINES:
              statuses[engine], findings[engine] = rows_of(PATHS[engine])


          def cwes_of(engine):
              return {row[2] for row in findings[engine] if row[2] is not None}


          def matched(engine, row):
              """Any finding of `engine` in the same file within LINE_WINDOW lines of `row`."""
              return any(other[0] == row[0] and abs(other[1] - row[1]) <= LINE_WINDOW
                         for other in findings[engine])


          def cluster():
              """Group every finding into location slots (same file, lines within LINE_WINDOW)."""
              slots = []
              for engine in ENGINES:
                  for row in findings[engine]:
                      for slot in slots:
                          if slot["uri"] == row[0] and abs(slot["line"] - row[1]) <= LINE_WINDOW:
                              slot["line"] = min(slot["line"], row[1])
                              slot["engines"].add(engine)
                              slot["rows"].append((engine, row))
                              break
                      else:
                          slots.append({"uri": row[0], "line": row[1], "engines": {engine},
                                        "rows": [(engine, row)]})
              return sorted(slots, key=lambda slot: (slot["uri"], slot["line"]))


          def join_sorted(values):
              return ", ".join(sorted(set(values))) or "-"


          def cwe_cell(slot):
              return join_sorted("CWE-" + str(row[2]) for _e, row in slot["rows"]
                                 if row[2] is not None)


          slots_all = cluster()
          consensus = [slot for slot in slots_all if len(slot["engines"]) == len(ENGINES)]
          tcs_only = [slot for slot in slots_all if slot["engines"] == {"TimeCodeSecurity"}]
          blind = [slot for slot in slots_all if "TimeCodeSecurity" not in slot["engines"]]
          per_engine_gaps = ", ".join(
              "{}: {}".format(engine, sum(1 for slot in blind if engine in slot["engines"]))
              for engine in ("CodeQL", "Semgrep"))

          md = [
              "# Boss Arena 3-Way Showdown: TimeCodeSecurity vs CodeQL vs Semgrep OSS",
              "",
              "Arena: **{}** - `{}` @ `{}`, {} `.py` and {} `.html` files.".format(
                  os.environ.get("ARENA_LABEL", os.environ.get("ARENA", "n/a")),
                  os.environ.get("REPO", "n/a"),
                  os.environ.get("TARGET_REF_USED", "n/a"),
                  os.environ.get("TARGET_PY_FILES", "n/a"),
                  os.environ.get("TARGET_HTML_FILES", "n/a")),
              "",
              "Referee rules, identical for all three engines: locations join on "
              "`(same file, |line difference| <= {})`; CWEs are normalised from `ruleId`, "
              "`*.properties.cwe`, `*.properties.tags`, `properties.subcategories`, an embedded "
              "`result.rule`, rule `id`/`name`/`shortDescription` and `taxonomies`. No ground-truth "
              "file is used, so nothing below is a precision or recall number - it is agreement and "
              "disagreement between three independent analysers.".format(LINE_WINDOW),
              "",
              "## Headline",
              "",
              "| Engine | Findings | Distinct CWEs | Slots | SARIF | Process exit |",
              "| :--- | ---: | ---: | ---: | :--- | :--- |",
          ]
          for engine in ENGINES:
              code = os.environ.get(EXIT_KEYS[engine], "")
              exit_label = ("not recorded (assumed 0/1)" if code == "" else
                            code if code in NORMAL_SCAN_EXITS else f"**{code} (abnormal)**")
              slot_count = sum(1 for slot in slots_all if engine in slot["engines"])
              md.append(f"| {engine} | {len(findings[engine])} | {len(cwes_of(engine))} | "
                        f"{slot_count} | {statuses[engine]} | {exit_label} |")
          md.append("")

          usable = [engine for engine in ENGINES if statuses[engine] == "ok"]
          if len(usable) < len(ENGINES):
              missing = ", ".join(e for e in ENGINES if e not in usable)
              md += [f"> Engines with no usable SARIF: **{missing}**. Every agreement count below "
                     f"is computed only over the engines that actually reported, so it is not a "
                     f"head-to-head result until all three rows say `ok`.", ""]

          md += [
              "## TimeCodeSecurity blind spots (caught by CodeQL or Semgrep, missed by TCS)",
              "",
              f"**{len(blind)}** of {len(slots_all)} distinct locations were flagged by CodeQL "
              f"and/or Semgrep with no TCS finding within {LINE_WINDOW} lines "
              f"({per_engine_gaps}).",
              "",
              "| # | File | Line | CWE | Caught by | Rule(s) |",
              "| --: | :--- | ---: | :--- | :--- | :--- |",
          ]
          for number, slot in enumerate(blind[:MAX_ROWS], 1):
              md.append(f"| {number} | {slot['uri']} | {slot['line']} | {cwe_cell(slot)} | "
                        f"{'+'.join(sorted(slot['engines']))} | "
                        f"{join_sorted(f'{e}:{row[3]}' for e, row in slot['rows'])} |")
          if len(blind) > MAX_ROWS:
              md.append(f"| ... | *{len(blind) - MAX_ROWS} further locations are in the uploaded "
                        f"`boss-arena-results` artifact* | | | | | |")
          md.append("")

          md += [
              "## Shared consensus",
              "",
              f"- **{len(consensus)}** of {len(slots_all)} locations found by **all three** engines",
              f"- **{len(tcs_only)}** locations found **only** by TimeCodeSecurity - extra yield, "
              f"not verified true positives",
              f"- **{len(blind)}** locations found by CodeQL and/or Semgrep but **not** by TCS",
              "",
              "| Pair | Agreement (rows of the left engine matched) |",
              "| :--- | :--- |",
          ]
          for left, right in (("TimeCodeSecurity", "CodeQL"), ("TimeCodeSecurity", "Semgrep"),
                              ("CodeQL", "Semgrep")):
              total = len(findings[left])
              hits = sum(1 for row in findings[left] if matched(right, row))
              pct = f"{hits / total * 100:.0f}%" if total else "n/a"
              md.append(f"| {left} -> {right} | {hits} / {total} ({pct}) |")
          md.append("")

          matrix = {engine: cwes_of(engine) for engine in ENGINES}
          md += ["", "## CWE coverage matrix", "",
                 "| CWE | TCS | CodeQL | Semgrep | Status |",
                 "| :--- | :---: | :---: | :---: | :--- |"]
          for cwe in sorted(set().union(*matrix.values()) if matrix else set()):
              marks = {engine: cwe in matrix[engine] for engine in ENGINES}
              if all(marks.values()):
                  label = "all three"
              elif marks["TimeCodeSecurity"]:
                  friends = [e for e in ENGINES[1:] if marks[e]]
                  label = ("TCS + " + "+".join(friends)) if friends else "TCS only"
              else:
                  label = "**TCS blind spot (CWE family never reported)**"
              md.append(f"| CWE-{cwe} | " + " | ".join("Y" if marks[e] else "-" for e in ENGINES) +
                        f" | {label} |")

          md += ["", "## Reproducibility", "",
                 "- Engine commit checked out by this run: `"
                 + os.environ.get("TCS_HEAD_SHA", os.environ.get("GITHUB_SHA", "n/a")) + "` ("
                 "`git rev-parse HEAD` in the checkout, asserted equal to `github.sha`"
                 " by the Provenance step)",
                 "- Arena revision: `" + os.environ.get("REF", "n/a") + "` = `"
                 + os.environ.get("TARGET_SHA", "n/a")[:12] + "`",
                 "- Gate 1 (`scripts/run_all_checks.py`, 552 cases, 0 FP, 0 FN): enforced as a hard "
                 "prerequisite before any third-party tool ran.",
                 "- Clone: `git clone --depth 1 --single-branch --branch <ref>`, `.git` removed.",
                 "- CodeQL: `security-extended`, `build-mode: none`, `upload: false`, config paths "
                 f"scoped to `{TARGET_DIR}`.",
                 "- TimeCodeSecurity: `python -u cli.py "
                 f"scan {TARGET_DIR}/ --scope all --format json --sarif benchmark_results/tcs.sarif` "
                 "(no scan-level wall-clock wrapper).",
                 "- Job timeout: 180 minutes, Gate 1 first, then the three engines share what is left; "
                 "there is no separate TCS scan cap.",
                 "- Artifacts: `benchmark_results/` (three SARIF sets, engine logs, target inventory, "
                 "this report), plus the named trio `scan_profile.log`, `arena_result.json`, "
                 "`arena_result.sarif` in the `-named` artifact (whole-tree cgroup v2 `memory.peak` "
                 "sampler output included, from `cgroup_mem.log`).", ""]

          text = "\n".join(md)
          os.makedirs("benchmark_results", exist_ok=True)
          with open("benchmark_results/summary.md", "w", encoding="utf-8") as handle:
              handle.write(text)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(text)
          print(text)

          # A tool that produced nothing is a reported fact, not a job failure. Only a run where
          # nothing usable came out at all, or where an engine died abnormally, is invalid.
          if not usable:
              raise SystemExit("benchmark invalid: no engine produced a readable SARIF")
          abnormal = [f"{engine} exit {os.environ[key]}" for engine, key in EXIT_KEYS.items()
                      if os.environ.get(key, "") not in NORMAL_SCAN_EXITS]
          if abnormal:
              raise SystemExit("benchmark incomplete: " + "; ".join(abnormal))
          PY

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-arena-${{ github.event.inputs.arena }}-results
          path: benchmark_results/
          if-no-files-found: warn

      # The three required names get their own artifact so they are findable by name alone, without
      # unpacking the whole directory: a reviewer should be able to grab `scan_profile.log`,
      # `arena_result.json` and `arena_result.sarif` directly. A separate artifact is used instead of
      # listing them inside the `path:` of the step above, because those paths are already contained in
      # `benchmark_results/` and overlapping inputs make upload-artifact@v4's layout unpredictable.
      # `if-no-files-found: warn` keeps a scan that never wrote a SARIF visible as a warning rather
      # than turning the whole job red for a missing file that the run legitimately does not have.
      - name: Upload Named Arena Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boss-arena-${{ github.event.inputs.arena }}-named
          path: |
            benchmark_results/scan_profile.log
            benchmark_results/arena_result.json
            benchmark_results/arena_result.sarif
          if-no-files-found: warn
          compression-level: 9
