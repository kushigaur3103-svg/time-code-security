name: TimeCodeSecurity Scanner

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  tcs-scan:
    name: Scan repository with TimeCodeSecurity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run TimeCodeSecurity
        uses: ./
        with:
          path: '.'
          fail-on-critical: 'false'
          sarif-file: 'tcs-results.sarif'