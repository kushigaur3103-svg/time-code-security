name: "Benchmark - VAmPI Showdown (TimeCodeSecurity vs Semgrep)"

# Manual trigger only. No push/pull_request/schedule events, so a commit of this file
# costs zero runner minutes; the job runs only when someone presses "Run workflow".
on:
  workflow_dispatch:
    inputs:
      vampi_ref:
        description: 'VAmPI branch or tag to benchmark (its default branch is master)'
        required: false
        default: 'master'

permissions:
  contents: read

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Passed through the environment instead of interpolating the input straight into a
      # shell string, so a ref containing shell metacharacters cannot become a command.
      VAMPI_REF: ${{ github.event.inputs.vampi_ref }}

    steps:
      - name: Checkout TimeCodeSecurity (HEAD)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Engine & Benchmark Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Gate 1 needs flet: scripts/run_all_checks.py:56 does `import tcs_gui` and
          # tcs_gui.py:6 does `import flet as ft`. flet is not in requirements.txt, so on a
          # clean runner the gate died with ModuleNotFoundError before scanning anything.
          pip install flet
          pipx install semgrep || python -m pip install semgrep
          # Prove the gate's import chain resolves *here*, so a missing dependency shows up
          # as a dependency failure instead of a confusing crash in the next step.
          python -c "import flet, tcs_gui; from importlib.metadata import version; print('gate imports OK: flet', version('flet'))"
          semgrep --version

      # Refuse to benchmark with a broken engine: Gate 1 must be green before any number
      # produced below is worth reading. Deliberately no "|| true" here.
      - name: Verify Engine (Gate 1 baseline)
        run: python scripts/run_all_checks.py

      - name: Clone Target Platform (VAmPI)
        run: |
          : "${VAMPI_REF:=master}"
          git clone --depth 1 --branch "$VAMPI_REF" \
            https://github.com/erev0s/VAmPI.git target_vampi
          echo "VAMPI_PY_FILES=$(find target_vampi -name '*.py' | wc -l)" >> "$GITHUB_ENV"

      - name: Prepare Results Directory
        run: mkdir -p benchmark_results

      - name: Execute TCS Scan on VAmPI
        run: |
          python cli.py scan target_vampi \
            --sarif benchmark_results/tcs_vampi.sarif \
            > benchmark_results/tcs_stdout.txt 2>&1 \
            || echo "TCS_SCAN_EXIT=$?" >> "$GITHUB_ENV"

      - name: Execute Semgrep Scan on VAmPI
        # `--config auto` needs the Semgrep registry binding and exits 2 in a headless job.
        # `p/python` is the community Python ruleset. Either way this step can never break the
        # workflow: the exit code is recorded for the report and the trailing `true` pins the
        # step to success, so a Semgrep outage degrades the table instead of failing the run.
        run: |
          semgrep scan --config "p/python" --metrics=off --sarif \
            --output benchmark_results/semgrep_vampi.sarif \
            target_vampi \
            > benchmark_results/semgrep_stdout.txt 2>&1 \
            || echo "SEMGREP_SCAN_EXIT=$?" >> "$GITHUB_ENV"
          true

      # Every number below is parsed from the SARIF files produced above. TimeCodeSecurity is the
      # engine this repo owns, so its SARIF is mandatory and a missing/corrupt one fails the job.
      # Semgrep is only a reference point: no SARIF from it is reported as
      # "Error / Registry Offline" and the run still exits 0 with the full TimeCodeSecurity table.
      - name: Generate Comparative Scoreboard
        if: always()
        run: |
          python - << 'PY'
          import json
          import os
          import re
          import sys

          CWE_RE = re.compile(r"CWE[- ]?(\d+)", re.I)
          # 0 = nothing found, 1 = findings reported (cli.py:1050 returns 1 if blocking else 0;
          # semgrep does the same). Anything else means the process really did not run.
          NORMAL_SCAN_EXITS = {"", "0", "1"}
          # Cap the in-run findings table so a huge scan cannot blow up the step summary page.
          MAX_ROWS = 200


          def load(path):
              """(status, data) - status is 'ok' or a human-readable failure."""
              if not os.path.exists(path):
                  return "no SARIF produced (scan step failed or timed out)", {}
              if os.path.getsize(path) == 0:
                  return "SARIF file is empty", {}
              try:
                  with open(path, encoding="utf-8") as handle:
                      return "ok", json.load(handle)
              except (OSError, ValueError) as exc:
                  return f"SARIF unreadable: {type(exc).__name__}", {}


          def results_of(data):
              rows = []
              for run in data.get("runs", []):
                  rows.extend(run.get("results", []))
              return rows


          def cwe_ids(data):
              ids = set()
              for run in data.get("runs", []):
                  rules = run.get("tool", {}).get("driver", {}).get("rules", [])
                  for res in run.get("results", []):
                      index = res.get("ruleIndex", -1)
                      rule = rules[index] if isinstance(index, int) and 0 <= index < len(rules) else {}
                      tags = rule.get("properties", {}).get("tags", [])
                      fields = [res.get("ruleId", "") or "", res.get("rule", "") or "",
                                rule.get("id", "") or "", rule.get("name", "") or ""]
                      fields += [str(tag) for tag in tags if isinstance(tag, (str, int))]
                      for field in fields:
                          match = CWE_RE.search(field)
                          if match:
                              ids.add(int(match.group(1)))
              return ids


          def rows_of(data):
              """One (file, line, rule, category, message) tuple per SARIF result."""
              out = []
              for run in data.get("runs", []):
                  rules = run.get("tool", {}).get("driver", {}).get("rules", [])
                  for res in run.get("results", []):
                      uri, line = "?", "?"
                      for loc in res.get("locations", []):
                          place = loc.get("physicalLocation", {})
                          uri = place.get("artifactLocation", {}).get("uri", uri)
                          line = place.get("region", {}).get("startLine", line)
                          break
                      index = res.get("ruleIndex", -1)
                      rule = rules[index] if isinstance(index, int) and 0 <= index < len(rules) else {}
                      category = rule.get("shortDescription", {}).get("text", "") or rule.get("name", "")
                      message = (res.get("message", {}).get("text", "") or "").replace("|", "/")[:90]
                      out.append((uri, line, res.get("ruleId", "") or rule.get("id", "") or "?",
                                  category, message))
              return out


          def status(exit_key, state):
              """Renderer-facing label. Exit 1 == 'findings exist', which is the point of
              scanning a deliberately vulnerable app, so it is a normal result."""
              code = os.environ.get(exit_key, "")
              if code and code not in NORMAL_SCAN_EXITS:
                  return f"**exit {code} (not a normal scanner result)**"
              if state != "ok":
                  return f"no SARIF (exit {code or '0'})"
              if code == "1":
                  return "ok (exit 1 = vulnerabilities found)"
              return "ok (exit 0)"


          def fatal(state, exit_key):
              """Empty string = this engine ran acceptably; otherwise why the run is invalid."""
              code = os.environ.get(exit_key, "")
              if state != "ok":
                  return f"no usable SARIF ({state})"
              if code not in NORMAL_SCAN_EXITS:
                  return f"unexpected exit code {code}"
              return ""


          tcs_status, tcs = load("benchmark_results/tcs_vampi.sarif")
          sg_status, sg = load("benchmark_results/semgrep_vampi.sarif")

          tcs_results, sg_results = results_of(tcs), results_of(sg)
          tcs_cwes, sg_cwes = cwe_ids(tcs), cwe_ids(sg)
          shared = sorted(tcs_cwes & sg_cwes)
          only_tcs = sorted(tcs_cwes - sg_cwes)
          only_sg = sorted(sg_cwes - tcs_cwes)

          def cell(count, cwes, state, failed_label):
              if state != "ok":
                  return f"**{failed_label}** ({state})"
              return f"{count} findings across {len(cwes)} distinct CWEs"

          single_engine = tcs_status == "ok" and sg_status != "ok"

          md = [
              "# VAmPI Benchmark Showdown: TimeCodeSecurity vs Semgrep",
              "",
              f"Target: [VAmPI](https://github.com/erev0s/VAmPI) "
              f"@ `{os.environ.get('VAMPI_REF') or 'master'}` "
              f"(a vulnerable Flask REST API), {os.environ.get('VAMPI_PY_FILES', 'n/a')} Python files.",
              "",
              "| Engine | Yield | Tool status |",
              "| :--- | :--- | :--- |",
              f"| TimeCodeSecurity | {cell(len(tcs_results), tcs_cwes, tcs_status, 'SCAN FAILED')} "
              f"| {status('TCS_SCAN_EXIT', tcs_status)} |",
              f"| Semgrep (`--config p/python`) "
              f"| {cell(len(sg_results), sg_cwes, sg_status, 'Error / Registry Offline')} "
              f"| {status('SEMGREP_SCAN_EXIT', sg_status)} |",
              "",
          ]

          if single_engine:
              md += [
                  "> **Single-engine run.** Semgrep produced no SARIF, so every count below is",
                  "> TimeCodeSecurity only. No comparison against Semgrep is implied, and nothing",
                  "> here should be quoted as a head-to-head result.",
                  "",
              ]

          if tcs_status == "ok" and sg_status == "ok":
              md += [
                  "## CWE coverage overlap",
                  "",
                  f"- Shared by both engines: {len(shared)} "
                  f"{'(CWE-' + ', CWE-'.join(str(c) for c in shared) + ')' if shared else '(none)'}",
                  f"- Only TimeCodeSecurity: {len(only_tcs)} "
                  f"{'(CWE-' + ', CWE-'.join(str(c) for c in only_tcs) + ')' if only_tcs else '(none)'}",
                  f"- Only Semgrep: {len(only_sg)} "
                  f"{'(CWE-' + ', CWE-'.join(str(c) for c in only_sg) + ')' if only_sg else '(none)'}",
                  "",
              ]
          elif single_engine:
              md += [
                  "## CWE coverage found by TimeCodeSecurity",
                  "",
                  f"Overlap with Semgrep is not computed: Semgrep produced no SARIF. "
                  f"TimeCodeSecurity covered {len(tcs_cwes)} distinct CWEs "
                  f"(CWE-{', CWE-'.join(str(c) for c in sorted(tcs_cwes))}).",
                  "",
              ]
          else:
              md += ["## CWE coverage overlap", "",
                     "Not computed: TimeCodeSecurity produced no usable SARIF.", ""]

          if tcs_status == "ok":
              tcs_rows = rows_of(tcs)
              md += [
                  f"## TimeCodeSecurity findings on VAmPI ({len(tcs_rows)} total)",
                  "",
                  "| # | File | Line | CWE | Category | Message |",
                  "| --: | :--- | ---: | :--- | :--- | :--- |",
              ]
              for number, row in enumerate(tcs_rows[:MAX_ROWS], 1):
                  uri, line, rule_id, category, message = row
                  md.append(f"| {number} | {uri} | {line} | {rule_id} | {category} | {message} |")
              if len(tcs_rows) > MAX_ROWS:
                  md.append(f"| ... | *{len(tcs_rows) - MAX_ROWS} further rows are in the "
                            f"uploaded `tcs_vampi.sarif` artifact* | | | | |")
              md.append("")

          md += [
              "## What this run does NOT measure",
              "",
              "- **Precision and recall.** Neither is computed here: labelling VAmPI findings as true or",
              "  false positive needs a hand-adjudicated ground truth for this target, which lives in the",
              "  repo benchmark suite (`scripts/run_all_checks.py`, run above) and not in this workflow.",
              "  The two Yield numbers above are raw output volume, not accuracy - a higher count can just",
              "  as easily mean more noise.",
              "- **Same file set is not guaranteed.** TimeCodeSecurity also parses HTML templates and",
              "  config files, while `--config p/python` loads only the community Python ruleset, so",
              "  totals are indicative rather than directly comparable.",
              "- **Business-logic flaws (BOLA/IDOR) and ReDoS.** Both engines are pattern/taint based and",
              "  neither models request-level authorisation state, so VAmPI's broken-object-level",
              "  authorization endpoints are expected to be missed by both. That is a stated limitation",
              "  of the approach, not a measured result of this run.",
              "",
              "## Reproducibility",
              "",
              "- Engine commit: `" + os.environ.get("GITHUB_SHA", "n/a")[:7] + "`",
              "- Gate 1 status: enforced as a hard prerequisite step before the scans.",
              "- Artifacts: `benchmark_results/` (each SARIF that was produced, both stdout logs,",
              "  this report).",
              "",
          ]

          text = "\n".join(md)
          with open("benchmark_results/summary.md", "w", encoding="utf-8") as handle:
              handle.write(text)
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(text)
          print(text)

          # TimeCodeSecurity is mandatory: no usable SARIF, or an exit code outside 0/1, fails the
          # job. Semgrep is optional by design - its problem is written to stderr and shown in the
          # table, and the run still exits 0 with the full TimeCodeSecurity table above.
          sg_note = fatal(sg_status, "SEMGREP_SCAN_EXIT")
          if sg_note:
              print(f"[warn] Semgrep did not contribute to this benchmark: {sg_note}",
                    file=sys.stderr)
          tcs_note = fatal(tcs_status, "TCS_SCAN_EXIT")
          if tcs_note:
              raise SystemExit("benchmark incomplete: " + tcs_note)
          PY

      - name: Upload Benchmark Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vampi-benchmark-results
          path: benchmark_results/
