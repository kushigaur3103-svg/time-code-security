name: "Level 3 Showdown: TCS vs Semgrep (PyGoat OWASP Ground Truth)"

on:
  workflow_dispatch:
    inputs:
      tcs_profile:
        description: 'Enable verbose engine profiling'
        required: true
        default: 'true'
        type: boolean

jobs:
  pygoat-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout TimeCodeSecurity Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Scanner Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Clone PyGoat Target Repository
        run: |
          git clone --depth 1 https://github.com/adeyosemanputra/pygoat.git pygoat_target
          COUNT=$(find pygoat_target -name "*.py" | wc -l)
          echo "PYGOAT_FILES=$COUNT" >> $GITHUB_ENV

      - name: Prepare Reports Directory
        run: mkdir -p reports

      # ------------------------------------------------------------------
      # 1. RUN TIMECODESECURITY (TCS)
      # ------------------------------------------------------------------
      - name: Run TimeCodeSecurity on PyGoat
        run: |
          echo "=========================================================="
          echo " 1. RUNNING TIMECODESECURITY (TCS) ON PYGOAT"
          echo "=========================================================="

          START_TIME=$(date +%s)
          python cli.py scan pygoat_target --format json > reports/tcs_pygoat.json || true
          END_TIME=$(date +%s)

          ELAPSED=$(( END_TIME - START_TIME ))
          echo "TCS_TIME=${ELAPSED}" >> $GITHUB_ENV

          FINDINGS=$(python -c "import json; data=json.load(open('reports/tcs_pygoat.json')); print(len(data.get('findings', data.get('runs', [{}])[0].get('results', []))))" 2>/dev/null || echo "0")
          echo "TCS_FINDINGS=${FINDINGS}" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # 2. RUN SEMGREP (OWASP & SECURITY RULES)
      # ------------------------------------------------------------------
      - name: Run Semgrep on PyGoat
        run: |
          echo "=========================================================="
          echo " 2. RUNNING SEMGREP ON PYGOAT"
          echo "=========================================================="

          START_TIME=$(date +%s)
          semgrep scan pygoat_target --config "p/python" --config "p/owasp-top-ten" --json --output reports/semgrep_pygoat.json || true
          END_TIME=$(date +%s)

          ELAPSED=$(( END_TIME - START_TIME ))
          echo "SEMGREP_TIME=${ELAPSED}" >> $GITHUB_ENV

          FINDINGS=$(python -c "import json; data=json.load(open('reports/semgrep_pygoat.json')); print(len(data.get('results', [])))" 2>/dev/null || echo "0")
          echo "SEMGREP_FINDINGS=${FINDINGS}" >> $GITHUB_ENV

      # ------------------------------------------------------------------
      # 3. GENERATE COMPARATIVE SHOWDOWN REPORT (pure Bash echo)
      # ------------------------------------------------------------------
      - name: Generate Showdown Scorecard
        run: |
          echo "# Level 3 Ground-Truth Showdown: TCS vs Semgrep (PyGoat)" > reports/pygoat_summary.md
          echo "" >> reports/pygoat_summary.md
          echo "| Metric | TimeCodeSecurity (TCS) | Semgrep (p/python + OWASP) |" >> reports/pygoat_summary.md
          echo "| :--- | :--- | :--- |" >> reports/pygoat_summary.md
          echo "| **Target Files** | ${{ env.PYGOAT_FILES }} modules | ${{ env.PYGOAT_FILES }} modules |" >> reports/pygoat_summary.md
          echo "| **Execution Time** | ${{ env.TCS_TIME }}s | ${{ env.SEMGREP_TIME }}s |" >> reports/pygoat_summary.md
          echo "| **Total Findings** | **${{ env.TCS_FINDINGS }}** | **${{ env.SEMGREP_FINDINGS }}** |" >> reports/pygoat_summary.md
          echo "| **Detection Precision** | Source-to-Sink Taint Flow | Pattern/Regex Signatures |" >> reports/pygoat_summary.md

          cat reports/pygoat_summary.md >> $GITHUB_STEP_SUMMARY
          cat reports/pygoat_summary.md

      - name: Upload Scan Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pygoat-showdown-artifacts
          path: reports/
