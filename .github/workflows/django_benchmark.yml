name: Level 2 Django Benchmark Showdown

on:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout TimeCodeSecurity
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install semgrep

      - name: Clone Django Core
        run: |
          git clone --depth 1 https://github.com/django/django.git django_target

      - name: Run Level 2 Benchmark
        run: |
          mkdir -p reports

          echo "=========================================================="
          echo " 1. RUNNING TIMECODESECURITY (TCS) ON DJANGO CORE"
          echo "=========================================================="
          start_tcs=$(date +%s)
          python cli.py scan django_target/django --format json --sarif reports/django_tcs.sarif
          end_tcs=$(date +%s)
          tcs_time=$((end_tcs - start_tcs))
          echo ">> TCS Completed in ${tcs_time}s"

          echo ""
          echo "=========================================================="
          echo " 2. RUNNING SEMGREP ON DJANGO CORE"
          echo "=========================================================="
          start_sem=$(date +%s)
          semgrep scan --config=p/python --json -o reports/django_semgrep.json django_target/django || true
          end_sem=$(date +%s)
          sem_time=$((end_sem - start_sem))
          echo ">> Semgrep Completed in ${sem_time}s"

          echo ""
          echo "=========================================================="
          echo " SUMMARY"
          echo " TCS Time: ${tcs_time}s"
          echo " Semgrep Time: ${sem_time}s"
          echo "=========================================================="

      - name: Upload Scan Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: django-benchmark-reports
          path: reports/
