name: "TimeCodeSecurity Scanner"
description: "High-precision AST-based SAST scanner for Python"

inputs:
  path:
    description: "Target scan path"
    required: false
    default: "."
  fail-on-critical:
    description: "Exit with code 1 on Critical/High findings"
    required: false
    default: "true"
  sarif-file:
    description: "Output file path for SARIF report"
    required: false
    default: "tcs-results.sarif"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Run TCS scan
      shell: bash
      env:
        TCS_SCAN_PATH: ${{ inputs.path }}
        TCS_FAIL_ON_CRITICAL: ${{ inputs.fail-on-critical }}
        TCS_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        args=(scan "$TCS_SCAN_PATH" --sarif "$TCS_SARIF_FILE")
        if [[ "$TCS_FAIL_ON_CRITICAL" == "true" ]]; then
          args+=(--fail-on-critical)
        fi
        python cli.py "${args[@]}"

    - name: Upload SARIF report
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
