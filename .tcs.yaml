# Repository-wide TCS noise policy.
#
# Two shapes, and the difference matters:
#   exclude_paths  -> the file is never read at all, for EVERY rule, including CWE-798.
#   rules.<cwe>.exclude -> that rule goes quiet in those trees; every other rule still runs.
#
# So the global list stays tiny (prose and scratch harnesses) and the noise directories of a
# vendored project are excluded per rule. Secrets are never excluded anywhere: a token
# committed in `examples/`, `scripts/`, `.github/` or `docker/` is the classic true positive.
#
# Patterns are matched against the collected path AND against that path seen from inside the
# directory named on the command line, so `docs/**` means the same thing for `scan .` and for
# `scan target_arena`.
#
# Three requested exclusions were refused, and `benchmark/gates/workflow_controls_probe.py`
# re-proves the reason on every run: CWE-1357 can only ever fire under a `.github/` segment
# (`iac_auditor.is_workflow_path`), so excluding `.github/**` would delete the whole rule;
# CWE-250 exists only as a Dockerfile finding and has 0 blessed rows in either baseline, so no
# measurement could catch its loss; and CWE-208 under `**/tests/**` reaches 19 blessed keys.
#
# SHAPE LAW for the global list (bulk-noise mandate, measured): a `exclude_paths` entry must name
# a tree at the scan root (`docs/**`), never a tree that can appear anywhere (`**/utils/**`).
# The difference is not style -- on the frozen arena artifact the deep form silences 165 rows
# across 11 rules and **28 of them live in `src/transformers/utils/`**, i.e. library code, while
# the anchored form silences the same 126 scaffolding rows and **0** production rows. A global is
# a never-read, so the deep spelling is a file skip over production code, which is the one thing
# the blessed baselines cannot see: its reach measured 0 of 425 and 0 of 119 in every spelling.
# The gate now fails on (a) any global starting with `**/`, (b) any global that selects a path
# where a hardcoded secret is classically committed, (c) any global that selects even one path a
# sole-source rule can emit on (that is how `**/.github/**` would have deleted CWE-1357 -- all 115
# of its arena rows are that rule, and it has 0 blessed rows, so MISSING=0 stays green while the
# rule dies), and (d) any rule carrying the depth-free `**/utils/**`.

exclude_paths:
  - "docs/**"
  - "scratch/**"

rules:
  # Weak randomness: benchmark/demo/example draws are noise, a `secrets`/token draw is not.
  # The engine already mutes display-value and `populate/` draws by AST shape; these trees
  # are the ones whose *path* is proof enough. `tests/**` is NOT here: 7 of the 7 blessed
  # Big-8 CWE-338 keys live in a `tests/` tree (tests/generation/test_utils.py:3352/3367/3384,
  # tests/test_modeling_common.py:6606/6698/6722, tests/models/whisper/…:97), so excluding it
  # would delete that rule's whole frozen population the moment the scan is aimed at a
  # subdirectory. It was shipped that way until `workflow_controls_probe.py` measured it.
  #
  # Counted again on the frozen Transformers artifact (`benchmark_results/tcs.sarif`: 2,777 rows,
  # CWE-338 = 194 rows over 86 files, `src/` 113 + `tests/` 81), through the real matcher
  # (`TcsConfig._selects`): all SEVEN patterns below select **0 rows** -- no `populate/`, `demo/`,
  # `examples/`, `scripts/`, `.github/`, `.circleci/` or `docker/` directory in that arena emits
  # CWE-338 at all. They stay because each one was measured to 0 blessed reach before it shipped
  # and a different arena may hold those trees; they are not what moved this rule's noise.
  # What this rule's noise actually is, moved in the engine instead: `ML_MATH_RANDOM_PREFIXES`
  # gained `tensorflow` / `jax` / `ray.tune` / `nn.initializers`, which are 29 + 3 + 5 + 2 = 39 rows
  # in 22 files whose callee root is a proven numeric library (8 more were already exempt at HEAD on
  # `torch` / `numpy.random`). The 147 that stay loud are 122 on the stdlib `random` root and 25 on
  # object names (`distributions`, `self`, `model`, `prior`), and every credential-named draw stays
  # reported whatever the library (`cwe338_ml_math_probe.py`, 117 cases, 5 falsifications).
  # Refused with its number: `**/tests/trainer/**` -- 3 arena rows, own blessed reach 0, parent
  # `**/tests/**` reach 7 (all seven Big-8 CWE-338 keys, of the 16 blessed in total). A slice of a
  # refused tree inherits the refusal; the 0 is a property of these two corpora, not of the
  # directory. Locked by `REFUSED_SLICES` in `workflow_controls_probe.py` (mutation
  # `refused_tree_slice_shipped`) and by
  # `tests/test_workflow_controls.py::test_a_slice_of_a_refused_tree_is_refused_with_it`.
  CWE-338:
    exclude:
      - "**/populate/**"
      - "**/demo/**"
      - "**/examples/**"
      - "**/scripts/**"
      - "**/.github/**"
      - "**/.circleci/**"
      - "**/docker/**"

  # Command construction in CI and example scripts is shell-by-design, not injection.
  CWE-78:
    exclude:
      - "tests/**"
      - "utils/**"
      - "**/examples/**"
      - "**/scripts/**"
      - "**/.github/**"
      - "**/.circleci/**"
      - "**/docker/**"

  # Path building under a fixture/example tree has no attacker-controlled prefix. `tests/**` is
  # NOT here either: 11 of the 16 blessed Big-8 CWE-22 keys and 6 of the 8 parity ones live in a
  # `tests/` tree (tests/models/markuplm/test_tokenization_markuplm.py:73/75/77/138,
  # tests/generation/test_utils.py:5537/5539/5565, tests/test_modeling_common.py:1279,
  # tests/test_tokenization_mistral_common.py:263/274/280). The engine already mutes the quiet
  # shape by AST proof -- `_c22_path_is_internal_repo_anchor` -- so the path axis adds nothing
  # that does not cost a true positive.
  # The two scaffolding trees are new, and both halves of the claim are measured. Yield, off the
  # frozen arena artifact (`benchmark_results/tcs.sarif`, 2,777 rows, 1,162 of them CWE-22):
  # `**/transformers/commands/**` selects 50 rows in 2 files, `**/transformers/benchmark/**`
  # selects 3 rows in 1 file -- 53 of 1,162. Safety: `workflow_controls_probe.py`'s blessed-reach
  # tier proves 0 of the 24 blessed CWE-22 keys (8 parity + 16 Big-8) are selected in the stored,
  # leaf, arena or corpus-relative spelling, and a ninth check scans a temporary tree to prove the
  # globs are alive, bounded to those two directories and rule-scoped.
  # The `transformers/` prefix is load-bearing, not decoration: all 8 parity blessed CWE-22 keys
  # live under `benchmark/` (`benchmark/corpus/cwe_22_traversal/*.py`,
  # `benchmark/corpus/cwe_937_insecure_protocol/test_v06_*.py`, `benchmark/runner.py:105`), so the
  # bare `**/benchmark/**` spelling deletes all 8 in one line -- measured 8 of 8, in every spelling
  # the gate tries, and 0 of 16 Big-8. That un-qualified pattern is therefore registered as a
  # *refused* exclusion (`REFUSED_EXCLUDES`) and re-proved as the mutation
  # `c22_scaffold_exclude_drops_the_package_prefix`.
  CWE-22:
    exclude:
      # The arena's top-level `utils/` script tree: 86 rows. Anchored on purpose -- the deep
      # `**/utils/**` spelling would also quiet the 8 traversal rows under
      # `src/transformers/utils/`, which is library code. Reach 0 of the 24 blessed CWE-22 keys in
      # every spelling, and `check_shipped_nonprod_exclude()` re-proves both halves by scanning a
      # temp tree.
      - "utils/**"
      - "**/examples/**"
      - "**/scripts/**"
      - "**/docker/**"
      - "**/transformers/commands/**"
      - "**/transformers/benchmark/**"

  # Log forging needs a request; the CLI, CI and example scripts that print counters do not.
  # Measured against the frozen baselines this reaches nothing: 0 of 425 parity rows and 0 of
  # 119 Big-8 rows sit under a `tests/` *segment* for CWE-117 -- the 43 blessed Big-8 rows are
  # all in `src/transformers/**`, where this rule stays loud. `**/tests/**` adds the *nested*
  # test trees (`src/transformers/tests/`), and is measured the same way: 0 of 425, 0 of 119.
  CWE-117:
    exclude:
      # 9 rows in the top-level `utils/` scripts (log forging needs a request, a build script does
      # not). 0 rows of this rule live under a `tests/` segment in the arena, so the tests entries
      # below already buy that tree completely -- measured, not assumed.
      - "utils/**"
      - "tests/**"
      - "**/tests/**"
      - "**/examples/**"
      - "**/scripts/**"
      - "**/.github/**"
      - "**/.circleci/**"
      - "**/docker/**"

  # Timing compares are a heuristic over in-process values, so an example script that checks
  # two token strings is noise. `**/tests/**` is NOT excluded here and never will be without a
  # new measurement: 19 of the 30 blessed Big-8 CWE-208 keys live in a `tests/` tree
  # (tests/generation/test_utils.py, tests/models/markuplm/test_tokenization_markuplm.py), so
  # that glob would delete two thirds of the rule's hard-won true positives.
  CWE-208:
    exclude:
      - "**/examples/**"

  # Deserialization in a test fixture or a sample is the fixture talking to itself; the
  # production loader stays loud. Measured 0 of 425 parity and 0 of 119 Big-8 rows reached.
  CWE-502:
    exclude:
      - "**/examples/**"
      - "**/tests/**"

  # Cleartext URLs in tests and samples point at localhost or a mock server. Measured 0 of 425
  # parity (35 blessed CWE-319 rows, none in these trees) and 0 of 119 Big-8 rows reached.
  CWE-319:
    exclude:
      - "**/examples/**"
      - "**/tests/**"

  # Upload handlers written into a temp tree by a test are not a deployed file sink. Measured
  # 0 of 425 parity (7 blessed rows) and 0 of 119 Big-8 rows reached.
  CWE-434:
    exclude:
      - "**/examples/**"
      - "**/tests/**"

  # An XML parse inside a test tree is a fixture feeding itself, not a server reading an attacker's
  # document. Measured before shipping, over all 16 blessed CWE-611 keys (16 parity, 0 Big-8) in
  # every spelling the gate tries (stored, leaf, arena-reconstructed): reach = 0. It is structural,
  # not luck -- the blessed keys are benchmark/corpus/cwe_611_xxe/bad.py, cwe_652_xquery/test_v02_*
  # and cwe_776_xml_bomb/test_v01..v06_bad.py, and benchmark/ (638 .py), the cross-file fixtures
  # (53 .py) and the Big-8 corpus (8 .py) contain ZERO directories named tests or test, so this glob
  # has no matching path in either frozen population at all. The frozen file names do start with
  # `test_vNN_bad.py`, which is why the pattern is `**/tests/**` (a `tests/` *directory* segment)
  # and never `**/test_*.py`, which would reach those keys. Product effect measured on the arena
  # artifact: 366 of its 491 CWE-611 rows (17.20% of all 2,128 findings), over 62 files inside 37
  # distinct tests/ directories.
  # AST-shape narrowings stay in force everywhere: `_xml_sink_recognised` and
  # `_xml_input_is_internal_repo_file` still decide production, and a `defusedxml` or internal-repo
  # read outside a tests tree is still reported.
  CWE-611:
    exclude:
      - "**/tests/**"

  # ---- Bulk-noise slice (measured per rule, per tree, before shipping) --------------------------
  # Each entry below carries a number, and every number came from the gate's own machinery
  # (`_baseline_rows` + `_arena_spellings` + `path_matches`) against the frozen artifact
  # (`benchmark_results/tcs.sarif`, 2,777 rows). `rows` is what the arena loses, `reach` is what a
  # frozen true positive loses, `pop` is how many blessed keys that rule has. Nothing here has a
  # non-zero reach, and nothing here is a rule with `pop = 0` -- a rule with no frozen population
  # gets no exclusion, because `MISSING=0` is exactly what deleting it produces.
  # Refused, with the key that proves it: CWE-208 `**/tests/**` reach 19 of 36 (202 rows);
  # CWE-312 `**/tests/**` reach 1 of 7 -- and that one is the rule's ONLY Big-8 key
  # (tests/models/markuplm/test_tokenization_markuplm.py:74); CWE-770 `**/tests/**` reach 1;
  # CWE-95 `**/tests/**` reach 2; CWE-400 `**/tests/**` reach 6; CWE-22 `**/tests/**` reach 11
  # (410 rows); CWE-338 `**/tests/**` reach 7 (81 rows). CWE-117 `**/tests/**` was already shipped
  # and measures 0 arena rows, so re-adding it was refused as a no-op. CWE-1188 (4 rows) and
  # CWE-96 (1 row) get nothing: `pop = 0`.

  # Query building in a build script, a sample or a fixture is not a statement a server runs.
  # 6 + 3 + 8 = 17 rows; 0 of the 25 blessed CWE-89 keys reached.
  CWE-89:
    exclude:
      - "utils/**"
      - "**/examples/**"
      - "**/tests/**"

  # Code loaded from a scaffolding tree. 3 + 4 + 7 = 14 rows; 0 of 6 blessed.
  CWE-94:
    exclude:
      - "utils/**"
      - "**/examples/**"
      - "**/tests/**"

  # Reflected output in a CLI helper or a sample page. 1 + 2 = 3 rows; 0 of 15 blessed.
  CWE-79:
    exclude:
      - "utils/**"
      - "**/examples/**"

  # A redirect target chosen by a build script. 6 + 1 = 7 rows; 0 of 14 blessed.
  CWE-918:
    exclude:
      - "utils/**"
      - "**/tests/**"

  # Unbounded reads in tooling scripts and samples. 7 + 8 = 15 rows; 0 of 11 blessed.
  # `**/tests/**` is refused here: reach 1 (a blessed CWE-770 key sits in a tests tree).
  CWE-770:
    exclude:
      - "utils/**"
      - "**/examples/**"

  # ReDoS in a scaffolding regex or a sample. 4 + 1 = 5 rows; 0 of the 2 blessed keys.
  CWE-1333:
    exclude:
      - "utils/**"
      - "**/examples/**"

  # Cleartext writes made by a sample or a fixture. 12 + 2 = 14 rows; 0 of 3 blessed.
  CWE-532:
    exclude:
      - "**/examples/**"
      - "**/tests/**"

  # A dangerous hash in a sample is a doc snippet, not a shipped verifier. 11 rows; 0 of 12.
  # `**/tests/**` is refused here: reach 2.
  CWE-95:
    exclude:
      - "**/examples/**"

  # A temp file created by a sample. 1 + 5 = 6 rows; 0 of 7 blessed.
  CWE-377:
    exclude:
      - "**/examples/**"
      - "**/tests/**"

  # A credential blob copied into a sample. 2 rows; 0 of 7 blessed. This is the ONLY exclusion
  # CWE-312 carries: its `**/tests/**` half would delete its single blessed Big-8 finding
  # (tests/models/markuplm/test_tokenization_markuplm.py:74, `fp.write(json.dumps(vocab_tokens))`
  # under `with open(cls.vocab_file, "w")`), which is the whole reason the refusal above exists.
  # CWE-798 (hardcoded secrets) still has no exclusion of any kind, in any tree, anywhere.
  CWE-312:
    exclude:
      - "**/examples/**"
