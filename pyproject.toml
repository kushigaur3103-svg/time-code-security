[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "timecodesecurity"
version = "1.0.0"
description = "High-precision AST-based SAST scanner for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.scripts]
timecode = "cli:main"
tcsec = "cli:main"
tcs = "cli:main"

[tool.setuptools]
py-modules = [
    "app",
    "ast_scanner",
    "ci_reporter",
    "cli",
    "config_loader",
    "cross_file_engine",
    "delivery_models",
    "delivery_repository",
    "durable_delivery_sink",
    "event_bus",
    "event_publisher",
    "event_taxonomy",
    "function_summarizer",
    "html_auditor",
    "iac_auditor",
    "in_app_adapter",
    "manifest_parser",
    "master_rules_bank",
    "notification_models",
    "notification_policy",
    "notification_repository",
    "notification_routes",
    "notification_service",
    "osv_client",
    "rule_engine",
    "sarif_adapter",
    "secret_filters",
    "secret_scanner",
    "sqlite_delivery_repository",
    "sqlite_notification_repository",
    "ssrf_guard",
    "staged_scanner",
    "suppression_resolver",
    "symbol_indexer",
    "tcs_cli",
    "tcs_gui",
    "version_matcher",
    "webhook_adapter",
    "webhook_client",
    "webhook_formatters",
]
packages = [
    "remediation",
    "sca_reachability",
    "tcs",
    "tcs.analysis",
]

[tool.setuptools.package-data]
"*" = ["*.html", "*.yml", "*.yaml", "*.json"]

[tool.pytest.ini_options]
testpaths = ["scratch"]
norecursedirs = [".git", ".venv", "build", "dist", "node_modules", "__pycache__", ".*"]
